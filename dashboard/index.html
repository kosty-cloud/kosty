<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosty - AWS Cost &amp; Security Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const ServiceIcon = ({ service }) => {
            const icons = {
                ec2: 'fas fa-server', rds: 'fas fa-database', s3: 'fas fa-cloud',
                lambda: 'fas fa-bolt', ebs: 'fas fa-hdd', vpc: 'fas fa-network-wired',
                cloudwatch: 'fas fa-chart-line', elasticache: 'fas fa-memory',
                iam: 'fas fa-users-cog', cloudfront: 'fas fa-globe',
                backup: 'fas fa-archive', apigateway: 'fas fa-exchange-alt',
                bedrock: 'fas fa-robot', sagemaker: 'fas fa-brain',
                sg: 'fas fa-shield-alt', lb: 'fas fa-sitemap',
                default: 'fas fa-cube'
            };
            return <i className={`${icons[service] || icons.default} text-lg`} aria-hidden="true"></i>;
        };

        const StatCard = ({ title, value, icon, color, trend, subtitle }) => (
            <div className={`bg-white rounded-xl p-6 card-shadow border-l-4 ${color} hover:shadow-lg transition-shadow`}>
                <div className="flex items-center justify-between">
                    <div>
                        <p className="text-sm font-medium text-gray-600">{title}</p>
                        <p className="text-3xl font-bold text-gray-900 mt-2">{value}</p>
                        {subtitle && <p className="text-sm text-gray-500 mt-1">{subtitle}</p>}
                        {trend && <p className="text-sm text-green-600 mt-1">{trend}</p>}
                    </div>
                    <div>
                        <i className={`${icon} text-3xl ${color.replace('border-l-', 'text-')}`} aria-hidden="true"></i>
                    </div>
                </div>
            </div>
        );

        const IssueCard = ({ service, items, count, type, totalMonthlySavings, onIssueClick, onViewAll, severityColors }) => {
            const typeColors = {
                cost: 'border-orange-500',
                security: 'border-red-500',
                Cost: 'border-orange-500',
                Security: 'border-red-500'
            };

            const groupSavings = totalMonthlySavings || (items ? items.reduce((sum, item) => sum + (item.monthly_savings || 0), 0) : 0);

            return (
                <div className={`bg-white rounded-lg p-4 border-l-4 ${typeColors[type] || typeColors.cost} card-shadow hover:shadow-lg transition-shadow`}>
                    <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center space-x-3">
                            <ServiceIcon service={service} />
                            <div>
                                <h3 className="font-semibold text-gray-900 uppercase text-sm">{service}</h3>
                                <p className="text-xs text-gray-600 capitalize">{type} Issues</p>
                            </div>
                        </div>
                        <div className="flex flex-col items-end">
                            <span className="bg-blue-100 text-blue-800 text-sm font-medium px-2.5 py-0.5 rounded-full">
                                {count}
                            </span>
                            {groupSavings > 0 && (
                                <span className="text-xs font-semibold text-green-600 mt-1">
                                    <i className="fas fa-dollar-sign mr-0.5" aria-hidden="true"></i>
                                    ${groupSavings.toFixed(2)}/mo
                                </span>
                            )}
                        </div>
                    </div>

                    {items && items.length > 0 && (
                        <div className="mt-3 space-y-2">
                            {items.slice(0, 3).map((item, idx) => (
                                <div key={idx} className="text-sm bg-gray-50 p-3 rounded-lg cursor-pointer hover:bg-gray-100 transition-colors"
                                     role="button" tabIndex={0}
                                     onClick={() => onIssueClick(item)}
                                     onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onIssueClick(item); } }}>
                                    <div className="flex items-center justify-between">
                                        <span className="font-medium text-gray-900">
                                            {item.ResourceName || item.BucketName || item.InstanceId || item.ResourceId}
                                        </span>
                                        {(item.severity || item.Severity) && (
                                            <span className={`text-xs font-medium px-2 py-1 rounded-full ${severityColors[item.severity || item.Severity] || 'bg-gray-100 text-gray-800'}`}>
                                                {item.severity || item.Severity}
                                            </span>
                                        )}
                                    </div>
                                    <p className="text-xs text-gray-600 mt-1">{item.Issue}</p>
                                    {item.Region && (
                                        <p className="text-xs text-gray-500 mt-1">
                                            <i className="fas fa-map-marker-alt mr-1" aria-hidden="true"></i>
                                            {item.Region}
                                        </p>
                                    )}
                                    {item.monthly_savings > 0 && (
                                        <p className="text-xs text-green-600 font-semibold mt-1">
                                            <i className="fas fa-dollar-sign mr-1" aria-hidden="true"></i>
                                            ${item.monthly_savings.toFixed(2)}/month
                                        </p>
                                    )}
                                    <p className="text-xs text-blue-600 mt-1">
                                        <i className="fas fa-info-circle mr-1" aria-hidden="true"></i>
                                        Click for details
                                    </p>
                                </div>
                            ))}
                            {items.length > 3 && (
                                <button
                                    onClick={() => onViewAll(service, type, items)}
                                    className="w-full text-xs text-blue-600 hover:text-blue-800 font-medium py-2 hover:bg-blue-50 rounded transition-colors"
                                >
                                    <i className="fas fa-eye mr-1" aria-hidden="true"></i>
                                    View all {items.length} issues
                                </button>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        // Accessible modal wrapper: role=dialog, Escape to close, focus trap,
        // focus restore on close. Overlay click also closes.
        const Modal = ({ labelledBy, onClose, children }) => {
            const containerRef = useRef(null);
            const previouslyFocused = useRef(null);

            useEffect(() => {
                previouslyFocused.current = document.activeElement;
                const node = containerRef.current;

                const focusable = () => Array.from(
                    node.querySelectorAll('a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])')
                ).filter(el => el.offsetParent !== null);

                const first = focusable()[0];
                if (first) first.focus(); else node.focus();

                const onKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        e.preventDefault();
                        onClose();
                        return;
                    }
                    if (e.key === 'Tab') {
                        const items = focusable();
                        if (items.length === 0) { e.preventDefault(); return; }
                        const firstEl = items[0];
                        const lastEl = items[items.length - 1];
                        if (e.shiftKey && document.activeElement === firstEl) {
                            e.preventDefault();
                            lastEl.focus();
                        } else if (!e.shiftKey && document.activeElement === lastEl) {
                            e.preventDefault();
                            firstEl.focus();
                        }
                    }
                };

                document.addEventListener('keydown', onKeyDown);
                return () => {
                    document.removeEventListener('keydown', onKeyDown);
                    if (previouslyFocused.current && previouslyFocused.current.focus) {
                        previouslyFocused.current.focus();
                    }
                };
            }, [onClose]);

            return (
                <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 backdrop-blur-sm"
                     onClick={onClose}>
                    <div ref={containerRef} role="dialog" aria-modal="true" aria-labelledby={labelledBy} tabIndex={-1}
                         className="bg-white rounded-2xl shadow-2xl max-w-6xl w-full mx-4 max-h-[90vh] overflow-hidden"
                         onClick={(e) => e.stopPropagation()}>
                        {children}
                    </div>
                </div>
            );
        };

        const Dashboard = () => {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [loadError, setLoadError] = useState(null);
            const [view, setView] = useState('overview'); // 'overview' | 'security' | 'cost'
            const [selectedIssue, setSelectedIssue] = useState(null);
            const [viewAllModal, setViewAllModal] = useState(null);
            const [filters, setFilters] = useState({
                severity: 'all',
                service: 'all'
            });
            const chartRef = useRef(null);
            const pieChartRef = useRef(null);
            const severityChartRef = useRef(null);

            const severityColors = {
                critical: 'bg-red-100 text-red-800',
                high: 'bg-orange-100 text-orange-800',
                medium: 'bg-yellow-100 text-yellow-800',
                low: 'bg-green-100 text-green-800',
                Critical: 'bg-red-100 text-red-800',
                High: 'bg-orange-100 text-orange-800',
                Medium: 'bg-yellow-100 text-yellow-800',
                Low: 'bg-green-100 text-green-800'
            };

            // --- Data helpers (accept a type filter so a view is coherent end-to-end) ---

            const itemType = (item) => (item.type || item.Type || '').toLowerCase();
            const itemSeverity = (item) => (item.severity || item.Severity || '').toLowerCase();

            // Normalize both the flat (results.<account>:[items]) and legacy nested
            // formats into results.<account>.<service>.audit.{count,items}.
            const normalizeData = (currentData) => {
                if (!currentData || !currentData.results) return { results: {} };

                const normalized = { ...currentData, results: {} };

                Object.entries(currentData.results).forEach(([accountId, account]) => {
                    if (Array.isArray(account)) {
                        normalized.results[accountId] = {};
                        account.forEach(item => {
                            const service = (item.Service || item.service || 'unknown').toLowerCase();
                            if (!normalized.results[accountId][service]) {
                                normalized.results[accountId][service] = { audit: { count: 0, items: [] } };
                            }
                            normalized.results[accountId][service].audit.items.push(item);
                            normalized.results[accountId][service].audit.count++;
                        });
                    } else {
                        normalized.results[accountId] = account;
                    }
                });

                return normalized;
            };

            // Flatten every finding item, optionally filtered by type ('cost'|'security'|'all').
            const getItems = (currentData, typeFilter = 'all') => {
                if (!currentData) return [];
                const normalized = normalizeData(currentData);
                const out = [];
                Object.values(normalized.results).forEach(account => {
                    Object.values(account).forEach(commands => {
                        Object.values(commands).forEach(cmd => {
                            if (cmd.items) {
                                cmd.items.forEach(item => {
                                    if (typeFilter === 'all' || itemType(item) === typeFilter) {
                                        out.push(item);
                                    }
                                });
                            }
                        });
                    });
                });
                return out;
            };

            const getServiceData = (currentData, typeFilter) => {
                const services = {};
                getItems(currentData, typeFilter).forEach(item => {
                    const svc = (item.Service || item.service || 'unknown').toUpperCase();
                    services[svc] = (services[svc] || 0) + 1;
                });
                const sorted = Object.entries(services).sort(([,a], [,b]) => b - a);
                return { labels: sorted.map(([s]) => s), values: sorted.map(([,c]) => c) };
            };

            const getSavingsByService = (currentData) => {
                const services = {};
                getItems(currentData, 'cost').forEach(item => {
                    const svc = (item.Service || item.service || 'unknown').toUpperCase();
                    services[svc] = (services[svc] || 0) + (item.monthly_savings || 0);
                });
                const sorted = Object.entries(services).filter(([,v]) => v > 0).sort(([,a], [,b]) => b - a);
                return { labels: sorted.map(([s]) => s), values: sorted.map(([,v]) => Number(v.toFixed(2))) };
            };

            const getSeverityData = (currentData, typeFilter) => {
                const severities = { Critical: 0, High: 0, Medium: 0, Low: 0 };
                getItems(currentData, typeFilter).forEach(item => {
                    const sev = itemSeverity(item);
                    if (sev === 'critical') severities.Critical++;
                    else if (sev === 'high') severities.High++;
                    else if (sev === 'medium') severities.Medium++;
                    else severities.Low++;
                });
                return {
                    labels: Object.keys(severities).filter(k => severities[k] > 0),
                    values: Object.values(severities).filter(v => v > 0)
                };
            };

            const getStats = (currentData, typeFilter = 'all') => {
                const empty = { total: 0, costIssues: 0, securityIssues: 0, criticalIssues: 0, highIssues: 0, mediumIssues: 0, lowIssues: 0, servicesWithIssues: 0, totalMonthlySavings: 0, topSavingsService: null };
                if (!currentData) return empty;

                const items = getItems(currentData, typeFilter);
                const services = new Set();
                const savingsByService = {};
                let costIssues = 0, securityIssues = 0, criticalIssues = 0, highIssues = 0, mediumIssues = 0, lowIssues = 0, totalMonthlySavings = 0;

                items.forEach(item => {
                    const type = itemType(item);
                    const sev = itemSeverity(item);
                    const svc = (item.Service || item.service || 'unknown').toUpperCase();
                    services.add(svc);
                    if (type === 'cost') {
                        costIssues++;
                        const s = item.monthly_savings || 0;
                        totalMonthlySavings += s;
                        savingsByService[svc] = (savingsByService[svc] || 0) + s;
                    }
                    if (type === 'security') securityIssues++;
                    if (sev === 'critical') criticalIssues++;
                    else if (sev === 'high') highIssues++;
                    else if (sev === 'medium') mediumIssues++;
                    else lowIssues++;
                });

                let topSavingsService = null;
                let topVal = 0;
                Object.entries(savingsByService).forEach(([svc, v]) => { if (v > topVal) { topVal = v; topSavingsService = svc; } });

                return {
                    total: items.length,
                    costIssues, securityIssues, criticalIssues, highIssues, mediumIssues, lowIssues,
                    servicesWithIssues: services.size,
                    totalMonthlySavings,
                    topSavingsService
                };
            };

            // Group findings by service for the given view type.
            const getGroupedIssues = (currentData, typeFilter) => {
                const grouped = {};
                getItems(currentData, typeFilter).forEach(item => {
                    const service = (item.Service || item.service || 'unknown').toLowerCase();
                    const type = itemType(item) === 'cost' ? 'Cost' : 'Security';
                    const key = `${service}-${type.toLowerCase()}`;
                    if (!grouped[key]) {
                        grouped[key] = { service, type, items: [], count: 0, totalMonthlySavings: 0 };
                    }
                    grouped[key].items.push(item);
                    grouped[key].count++;
                    grouped[key].totalMonthlySavings += item.monthly_savings || 0;
                });
                return Object.values(grouped).sort((a, b) => b.count - a.count);
            };

            const getFilteredIssues = (issues) => {
                return issues.filter(issue => {
                    if (filters.service !== 'all' && issue.service.toLowerCase() !== filters.service.toLowerCase()) {
                        return false;
                    }
                    if (filters.severity !== 'all') {
                        const hasSeverity = issue.items.some(item => itemSeverity(item) === filters.severity.toLowerCase());
                        if (!hasSeverity) return false;
                    }
                    return true;
                });
            };

            const getAvailableServices = (currentData, typeFilter) => {
                const services = new Set();
                getItems(currentData, typeFilter).forEach(item => {
                    services.add((item.Service || item.service || 'unknown').toUpperCase());
                });
                return Array.from(services).sort();
            };

            // --- Charts: single effect keyed on data + view + filters ---

            const createCharts = useCallback(() => {
                if (!data || view === 'overview') return;
                const typeFilter = view; // 'security' | 'cost'

                [chartRef, pieChartRef, severityChartRef].forEach(ref => {
                    if (ref.current) {
                        const existing = Chart.getChart(ref.current);
                        if (existing) existing.destroy();
                    }
                });

                if (chartRef.current) {
                    const serviceData = getServiceData(data, typeFilter);
                    new Chart(chartRef.current.getContext('2d'), {
                        type: 'bar',
                        data: {
                            labels: serviceData.labels,
                            datasets: [{
                                label: 'Findings',
                                data: serviceData.values,
                                backgroundColor: typeFilter === 'cost' ? 'rgba(16, 185, 129, 0.8)' : 'rgba(239, 68, 68, 0.8)',
                                borderWidth: 1,
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => `${c.parsed.y} findings` } } },
                            scales: { y: { beginAtZero: true }, x: { ticks: { maxRotation: 45 } } }
                        }
                    });
                }

                if (pieChartRef.current) {
                    if (typeFilter === 'cost') {
                        const savings = getSavingsByService(data);
                        new Chart(pieChartRef.current.getContext('2d'), {
                            type: 'bar',
                            data: {
                                labels: savings.labels,
                                datasets: [{ label: 'Monthly savings (USD)', data: savings.values, backgroundColor: 'rgba(5, 150, 105, 0.85)', borderRadius: 8 }]
                            },
                            options: {
                                indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                                plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => `$${c.parsed.x.toFixed(2)}/mo` } } },
                                scales: { x: { beginAtZero: true } }
                            }
                        });
                    } else {
                        const severityData = getSeverityData(data, 'security');
                        new Chart(pieChartRef.current.getContext('2d'), {
                            type: 'doughnut',
                            data: {
                                labels: severityData.labels,
                                datasets: [{ data: severityData.values, backgroundColor: ['#DC2626', '#EA580C', '#D97706', '#059669'], borderWidth: 0 }]
                            },
                            options: {
                                responsive: true, maintainAspectRatio: false,
                                plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: (c) => `${c.label}: ${c.parsed} findings` } } }
                            }
                        });
                    }
                }

                if (severityChartRef.current) {
                    const severityData = getSeverityData(data, typeFilter);
                    new Chart(severityChartRef.current.getContext('2d'), {
                        type: 'bar',
                        data: {
                            labels: severityData.labels,
                            datasets: [{
                                label: 'Findings by severity',
                                data: severityData.values,
                                backgroundColor: ['#DC2626', '#EA580C', '#D97706', '#059669'],
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: { y: { beginAtZero: true } }
                        }
                    });
                }
            }, [data, view]);

            useEffect(() => {
                if (data && view !== 'overview') {
                    createCharts();
                }
            }, [data, view, filters, createCharts]);

            // --- Loading reports ---

            const loadJsonFile = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                setLoading(true);
                setLoadError(null);
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const jsonData = JSON.parse(e.target.result);
                        setData(jsonData);
                        setView('overview');
                        setFilters({ severity: 'all', service: 'all' });
                        setTimeout(() => setLoading(false), 400);
                    } catch (error) {
                        setLoadError('Invalid JSON file. Please upload a valid Kosty report.');
                        setLoading(false);
                    }
                };
                reader.readAsText(file);
            };

            const loadDemo = (filename) => {
                setLoading(true);
                setLoadError(null);
                fetch(filename)
                    .then(res => { if (!res.ok) throw new Error('fetch failed'); return res.json(); })
                    .then(jsonData => {
                        setData(jsonData);
                        setView('overview');
                        setFilters({ severity: 'all', service: 'all' });
                        setTimeout(() => setLoading(false), 400);
                    })
                    .catch(() => {
                        setLoadError('Could not load the demo file. Serve the dashboard over HTTP (e.g. python -m http.server) so the browser can fetch ' + filename + '.');
                        setLoading(false);
                    });
            };

            const formatDate = (timestamp) => {
                if (!timestamp) return 'Unknown';
                const d = new Date(timestamp);
                return isNaN(d.getTime()) ? 'Unknown' : d.toLocaleString();
            };

            // --- Landing (no data loaded) ---

            if (!data) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-center max-w-md">
                            <div className="gradient-bg text-white p-8 rounded-xl card-shadow mb-8">
                                <i className="fas fa-shield-halved text-6xl mb-4" aria-hidden="true"></i>
                                <h1 className="text-3xl font-bold mb-2">Kosty Dashboard</h1>
                                <p className="text-blue-100">AWS Cost &amp; Security Audit Analysis</p>
                            </div>

                            <div className="space-y-4">
                                <input type="file" accept=".json" onChange={loadJsonFile} className="hidden" id="json-upload" />
                                <label htmlFor="json-upload"
                                       className="bg-blue-600 text-white px-8 py-4 rounded-lg font-medium cursor-pointer hover:bg-blue-700 transition-colors inline-block shadow-lg w-full">
                                    <i className="fas fa-upload mr-2" aria-hidden="true"></i>
                                    Load JSON Report
                                </label>

                                <button onClick={() => loadDemo('demo_full_audit.json')}
                                        className="bg-green-600 text-white px-8 py-4 rounded-lg font-medium cursor-pointer hover:bg-green-700 transition-colors shadow-lg w-full">
                                    <i className="fas fa-eye mr-2" aria-hidden="true"></i>
                                    View Full Demo (Cost + Security)
                                </button>

                                <button onClick={() => loadDemo('demo_ai_audit.json')}
                                        className="bg-purple-600 text-white px-8 py-4 rounded-lg font-medium cursor-pointer hover:bg-purple-700 transition-colors shadow-lg w-full">
                                    <i className="fas fa-robot mr-2" aria-hidden="true"></i>
                                    View AI Audit Demo
                                </button>
                            </div>

                            {loadError && (
                                <p className="text-red-600 mt-4 text-sm" role="alert">{loadError}</p>
                            )}

                            <p className="text-gray-600 mt-4">
                                Upload your <code className="bg-gray-200 px-2 py-1 rounded">kosty audit --output json</code> file<br/>
                                or load a demo to see how it works
                            </p>
                        </div>
                    </div>
                );
            }

            const securityStats = getStats(data, 'security');
            const costStats = getStats(data, 'cost');
            const totalAccounts = Object.keys(data.results || {}).length;

            // --- Header (shared across views) ---

            const Header = () => (
                <div className="gradient-bg text-white">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <div className="flex items-center justify-between">
                            <div>
                                <h1 className="text-4xl font-bold flex items-center">
                                    <i className="fas fa-shield-halved mr-3" aria-hidden="true"></i>
                                    Kosty Dashboard
                                </h1>
                                <p className="text-blue-100 mt-2">AWS Cost &amp; Security Audit Analysis</p>
                                <p className="text-sm text-blue-200 mt-1">
                                    <i className="fas fa-clock mr-1" aria-hidden="true"></i>
                                    Last scan: {formatDate(data.scan_timestamp)}
                                </p>
                            </div>
                            <div className="text-right">
                                <input type="file" accept=".json" onChange={loadJsonFile} className="hidden" id="json-upload-header" />
                                <label htmlFor="json-upload-header"
                                       className="bg-white text-blue-600 px-4 py-2 rounded-lg font-medium cursor-pointer hover:bg-blue-50 transition-colors">

                                    </>
                                ) : groupedIssues.length > 0 ? (
                                    <div className="text-center py-12">
                                        <i className="fas fa-filter text-6xl text-gray-400 mb-4" aria-hidden="true"></i>
                                        <h3 className="text-xl font-semibold text-gray-900 mb-2">No Findings Match Filters</h3>
                                        <p className="text-gray-600 mb-4">Try adjusting your filter criteria.</p>
                                        <button onClick={() => setFilters({ severity: 'all', service: 'all' })}
                                                className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                                            Clear All Filters
                                        </button>
                                    </div>
                                ) : (
                                    <div className="text-center py-12">
                                        <i className="fas fa-check-circle text-6xl text-green-500 mb-4" aria-hidden="true"></i>
                                        <h3 className="text-xl font-semibold text-gray-900 mb-2">No {isCost ? 'Cost' : 'Security'} Findings</h3>
                                        <p className="text-gray-600">Nothing to report in this view.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {renderModals()}
                </div>
            );
        };

        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
